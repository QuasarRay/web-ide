name: Perry Native AOT Android

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "presentation/**"
      - "simulator/**"
      - ".github/workflows/perry-native-aot.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Shared-schema regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Repository checks
        run: npm run check

      - name: Native compatibility tests
        run: npx vitest run native/tests/compat.test.ts

  android:
    name: Perry LLVM AOT APK
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      PERRY_NO_TELEMETRY: "1"
      PERRY_FAST_MATH: "1"
      PERRY_LL_SIZE_OPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build shared presentation schema
        run: npx tsc --build presentation

      - name: Install Perry
        run: npm install --global @perryts/perry@0.5.1663

      - name: Configure Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager is unavailable."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      - name: Perry diagnostics
        run: perry doctor

      - name: Enforce strict native target
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -- "--enable-js-runtime" native/src native/package.json native/perry.toml; then
            echo "JavaScript runtime fallback is forbidden."
            exit 1
          fi

          if grep -R --line-number -E "WebView|react-dom|monaco-editor|window\.|document\.|localStorage" native/src; then
            echo "Browser/runtime dependency found in native source."
            exit 1
          fi

      - name: Perry strict compatibility check
        working-directory: native
        run: perry check src/main.ts --strict

      - name: Build O3 + fast-math ARM64 APK
        working-directory: native
        run: |
          mkdir -p dist
          perry compile src/main.ts \
            --target android \
            --fast-math \
            --app-bundle-id org.nand2tetris.native \
            -o dist/nand2tetris-native.apk
          ls -lh dist

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="native/dist/nand2tetris-native.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: nand2tetris-perry-aot-arm64
          path: native/dist/nand2tetris-native.apk
          if-no-files-found: error
          retention-days: 30
