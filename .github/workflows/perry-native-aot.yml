name: Perry Native AOT Android

on:
  pull_request:
    branches: [main, presentation-decoupling]
    paths:
      - "native/**"
      - "presentation/**"
      - "simulator/**"
      - ".github/workflows/perry-native-aot.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Shared-schema regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Repository checks
        run: npm run check

      - name: Native compatibility tests
        run: npx vitest run native/tests/compat.test.ts

  android:
    name: Perry LLVM AOT APK
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      PERRY_NO_TELEMETRY: "1"
      PERRY_FAST_MATH: "1"
      PERRY_LL_SIZE_OPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build shared presentation schema
        run: npx tsc --build presentation

      - name: Install Perry
        run: npm install --global @perryts/perry@0.5.1520

      - name: Configure Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager is unavailable."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      - name: Check out matching Perry source
        uses: actions/checkout@v4
        with:
          repository: PerryTS/perry
          ref: v0.5.1520
          path: .perry-src

      - name: Build Perry Android runtime archives
        shell: bash
        run: |
          set -euo pipefail

          # The npm 0.5.1520 compiler was packaged without Git metadata and
          # therefore expects Perry's source-content fingerprint (src:...).
          # A clean Git checkout would stamp these archives with git:<sha>
          # instead. A file-mode-only change marks the contract tree dirty
          # without changing any hashed bytes, forcing the identical source
          # fingerprint used by the npm compiler.
          chmod +x .perry-src/crates/perry-runtime/src/lib.rs

          rustup toolchain install nightly-2026-08-20 \
            --profile minimal \
            --target aarch64-linux-android

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$NDK_BIN/aarch64-linux-android24-clang"
          CLANGXX="$NDK_BIN/aarch64-linux-android24-clang++"

          test -x "$CLANG"
          test -x "$CLANGXX"

          export CC_aarch64_linux_android="$CLANG"
          export CXX_aarch64_linux_android="$CLANGXX"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"

          {
            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=$CLANGXX"
            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          } >> "$GITHUB_ENV"

          cd .perry-src

          cargo +nightly-2026-08-20 build \
            --profile dist \
            --target aarch64-linux-android \
            -p perry-runtime \
            -p perry-runtime-static

          cargo +nightly-2026-08-20 build \
            --profile dist \
            --target aarch64-linux-android \
            -p perry-stdlib \
            -p perry-stdlib-static

          cargo +nightly-2026-08-20 build \
            --profile dist \
            --target aarch64-linux-android \
            -p perry-ui-android

          LIB_DIR="$PWD/target/aarch64-linux-android/dist"

          for lib in \
            libperry_runtime.a \
            libperry_stdlib.a \
            libperry_ui_android.a
          do
            test -f "$LIB_DIR/$lib"
          done

          echo "PERRY_RUNTIME_DIR=$LIB_DIR" >> "$GITHUB_ENV"
          echo "PERRY_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"

          ls -lh "$LIB_DIR"/libperry_{runtime,stdlib,ui_android}.a

      - name: Perry diagnostics
        working-directory: native
        run: perry doctor

      - name: Enforce strict native target
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -- "--enable-js-runtime" native/src native/package.json native/perry.toml; then
            echo "JavaScript runtime fallback is forbidden."
            exit 1
          fi

          if grep -R --line-number -E "WebView|react-dom|monaco-editor|window\.|document\.|localStorage" native/src; then
            echo "Browser/runtime dependency found in native source."
            exit 1
          fi

      - name: Perry strict compatibility check
        working-directory: native
        run: perry check src/main.ts --strict

      - name: Build O3 + fast-math ARM64 APK
        working-directory: native
        run: |
          mkdir -p dist
          perry compile src/main.ts \
            --target android \
            --fast-math \
            --app-bundle-id org.nand2tetris.native \
            -o dist/nand2tetris-native.apk
          ls -lh dist

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="native/dist/nand2tetris-native.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: nand2tetris-perry-aot-arm64
          path: native/dist/nand2tetris-native.apk
          if-no-files-found: error
          retention-days: 30
