name: Perry Native Android

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "simulator/**"
      - ".github/workflows/perry-android.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Existing simulator regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Existing repository checks
        run: npm run check
      - name: Existing simulator tests
        run: npm test -w simulator -- --run
      - name: Native differential tests
        run: npx vitest run native/tests/compat.test.ts

  android:
    name: Perry AOT APK
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      PERRY_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Perry
        run: npm install --global @perryts/perry@0.5.1520

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager is unavailable on the GitHub Android runner."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check out matching Perry source
        uses: actions/checkout@v4
        with:
          repository: PerryTS/perry
          ref: v0.5.1520
          path: .perry-src

      - name: Build Perry Android runtime and UI archives
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install nightly-2026-08-20 --profile minimal --target aarch64-linux-android

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$NDK_BIN/aarch64-linux-android24-clang"
          CLANGXX="$NDK_BIN/aarch64-linux-android24-clang++"
          if [ ! -x "$CLANG" ] || [ ! -x "$CLANGXX" ]; then
            echo "Android API-24 NDK clang wrappers are missing."
            exit 1
          fi

          {
            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=$CLANGXX"
            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          } >> "$GITHUB_ENV"

          export CC_aarch64_linux_android="$CLANG"
          export CXX_aarch64_linux_android="$CLANGXX"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"

          cd .perry-src
          cargo +nightly-2026-08-20 build --profile dist --target aarch64-linux-android \
            -p perry-runtime -p perry-runtime-static
          cargo +nightly-2026-08-20 build --profile dist --target aarch64-linux-android \
            -p perry-stdlib -p perry-stdlib-static
          cargo +nightly-2026-08-20 build --profile dist --target aarch64-linux-android \
            -p perry-ui-android

          LIB_DIR="$PWD/target/aarch64-linux-android/dist"
          for lib in libperry_runtime.a libperry_stdlib.a libperry_ui_android.a; do
            test -f "$LIB_DIR/$lib" || {
              echo "Expected Perry Android archive is missing: $LIB_DIR/$lib"
              exit 1
            }
          done

          echo "PERRY_RUNTIME_DIR=$LIB_DIR" >> "$GITHUB_ENV"
          echo "PERRY_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"
          ls -lh "$LIB_DIR"/libperry_{runtime,stdlib,ui_android}.a

      - name: Perry toolchain diagnostics
        run: perry doctor

      - name: Reject browser/runtime fallbacks
        run: |
          if grep -R --line-number -- "--enable-js-runtime" native/src native/package.json; then
            echo "V8/JS-runtime fallback is forbidden for the native target."
            exit 1
          fi
          if grep -R --line-number -E "WebView|react-dom|monaco-editor" native/src; then
            echo "Browser runtime dependency found in native source."
            exit 1
          fi

      - name: Perry compatibility check
        run: perry check native/src/main.ts

      - name: Build optimized ARM64 Android APK
        run: |
          mkdir -p native/dist
          perry compile native/src/main.ts \
            --target android \
            --fast-math \
            -o native/dist/Nand2TetrisNative
          find native/dist -maxdepth 4 -type f -print

      - name: Verify APK exists
        id: apk
        shell: bash
        run: |
          APK="$(find native/dist -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Perry did not produce an APK."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: nand2tetris-perry-native-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
